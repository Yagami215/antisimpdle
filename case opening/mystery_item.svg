<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241b35" />
      <stop offset="60%" stop-color="#120c1d" />
      <stop offset="100%" stop-color="#07040a" />
    </radialGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="50%" stop-color="#f78e38" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4d79" />
      <stop offset="50%" stop-color="#2c2242" />
      <stop offset="100%" stop-color="#181126" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="14" fill="url(#bgGrad)" stroke="url(#metalRim)" stroke-width="3" />

  <!-- Diagonal Tech Hatch Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="-20" y1="20" x2="60" y2="-60" />
    <line x1="10" y1="70" x2="110" y2="-30" />
    <line x1="40" y1="120" x2="160" y2="0" />
    <line x1="70" y1="170" x2="210" y2="30" />
    <line x1="100" y1="220" x2="240" y2="80" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#f7d57f" stroke-width="2" opacity="0.6" />
  <path d="M 184 32 L 184 16 L 168 16" fill="none" stroke="#f7d57f" stroke-width="2" opacity="0.6" />
  <path d="M 16 168 L 16 184 L 32 184" fill="none" stroke="#f7d57f" stroke-width="2" opacity="0.6" />
  <path d="M 184 168 L 184 184 L 168 184" fill="none" stroke="#f7d57f" stroke-width="2" opacity="0.6" />

  <!-- Outer Hexagon / Shield -->
  <polygon points="100,28 152,58 152,118 100,148 48,118 48,58" 
           fill="#100b1a" stroke="#6c528e" stroke-width="2.5" opacity="0.85" />

  <!-- Inner Glowing Shield -->
  <polygon points="100,36 144,62 144,114 100,140 56,114 56,62" 
           fill="none" stroke="url(#crestGrad)" stroke-width="1.8" filter="url(#glow)" opacity="0.9" />

  <!-- Center Mystery Question Mark -->
  <text x="100" y="105" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="62" 
        fill="url(#crestGrad)" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#glow)">?</text>

  <!-- Subtitle Tag: CLASSIFIED -->
  <rect x="52" y="160" width="96" height="18" rx="4" fill="#1b1226" stroke="#4a3b63" stroke-width="1" />
  <text x="100" y="172" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="9" 
        letter-spacing="2.5" 
        fill="#f7d57f" 
        text-anchor="middle">CLASSIFIED</text>
</svg>